<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Code Generator</title>
  <link rel="shortcut icon" href="/qr-code.jpg" type="image/x-icon">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="container">
    <h1>QR Code Generator</h1>
    <p class="subtitle">
      Enter text, URL, or anything else
    </p>

    <div class="input_group">
      <input type="text" id="textInput" placeholder="Enter text or URL..." autocomplete="off">

      <button id="generateBtn">
        Generate QR
      </button>
    </div>

    <div class="qr_container">
      <canvas id="qrCanvas"></canvas>

      <p id="message">
        Your QR code will appear here.
      </p>
    </div>

    <button id="downloadBtn" class="download">
      Download PNG
    </button>

  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.5.2/qrcode.min.js"
    referrerpolicy="no-referrer"></script>



  <script src="/script.js"></script>
</body>

</html>
